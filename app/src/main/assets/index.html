<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VORTEX AI 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d18;color:#fff;font-family:Arial,sans-serif;padding:22px}
header{text-align:center;padding:20px 0}
h1{font-size:32px;color:#36cfff;margin:5px}
header p{color:#9baac3;margin:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#151e31;border:1px solid #263c5c;border-radius:16px;padding:22px 10px;text-align:center;color:#fff;font-size:15px;min-height:110px}
.card:active{background:#203957}
.icon{font-size:29px;display:block;margin-bottom:12px}
#screen{display:none;background:#151e31;border-radius:15px;padding:18px;margin-top:10px}
button{cursor:pointer;font-family:inherit}
.btn{background:#36cfff;color:#06101c;border:0;border-radius:9px;padding:11px 16px;font-weight:bold}
.btn.alt{background:#263c5c;color:#fff}
.row{display:flex;gap:8px;margin:10px 0}
input,textarea{width:100%;background:#0c1426;color:#fff;border:1px solid #263c5c;border-radius:9px;padding:11px;font-size:15px}
textarea{font-family:monospace;min-height:150px;resize:vertical}
.out{background:#050810;border:1px solid #263c5c;border-radius:9px;padding:11px;font-family:monospace;min-height:70px;white-space:pre-wrap;margin-top:8px;color:#7dffb0}
iframe{width:100%;height:340px;border:1px solid #263c5c;border-radius:9px;background:#fff}
.note{color:#9baac3;font-size:13px;line-height:1.4}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:#36cfff;font-size:38px;display:block;margin:16px auto}
.mic.on{background:#ff4d6d}
footer{text-align:center;color:#71819b;margin-top:26px;font-size:12px}
</style>
</head>
<body>
<header><h1>VORTEX AI 2.0</h1><p>Yapay zekâ kontrol merkezi</p></header>
<div class="grid" id="modules">
<button class="card" onclick="openM('chat')"><span class="icon">🤖</span>AI Sohbet</button>
<button class="card" onclick="openM('web')"><span class="icon">🌐</span>Web Tarayıcısı</button>
<button class="card" onclick="openM('voice')"><span class="icon">🎙️</span>Sesli Asistan</button>
<button class="card" onclick="openM('img')"><span class="icon">🖼️</span>AI Resim</button>
<button class="card" onclick="openM('mus')"><span class="icon">🎵</span>AI Müzik</button>
<button class="card" onclick="openM('vid')"><span class="icon">🎬</span>AI Video</button>
</div>
<div id="screen">
<div class="row" style="margin-top:0"><button class="btn alt" onclick="goBack()">← Geri</button></div>
<h2 id="title" style="margin:6px 0 10px"></h2>
<div id="body"></div>
</div>
<footer>VORTEX AI 2.0 · ANDROID</footer>
<script>
var T={chat:'AI Sohbet',py:'Python IDE',web:'Web Tarayıcısı',voice:'Sesli Asistan',img:'AI Resim',mus:'AI Müzik',vid:'AI Video'};
var rec=null;
function $(i){return document.getElementById(i)}
function openM(k){
 $('modules').style.display='none';$('screen').style.display='block';$('title').textContent=T[k];
 var b=$('body');
 if(k==='py'){
  b.innerHTML='<textarea id="code">print("Merhaba VORTEX")\nprint("Python editörü hazır")</textarea><div class="row"><button class="btn" onclick="runPy()">▶ Çalıştır</button><button class="btn alt" onclick="$(\'code\').value=\'\'">Temizle</button></div><div class="out" id="pout">Çıktı burada görünür</div><p class="note">Şimdilik basit çalıştırıcı: sadece print(...) satırlarını gösterir.</p>';
 }else if(k==='web'){
  b.innerHTML='<div class="row"><input id="url" placeholder="adres yaz, örn. wikipedia.org" value="wikipedia.org"><button class="btn" onclick="goWeb()">Git</button></div><iframe id="fr" title="tarayıcı"></iframe><p class="note">Bazı siteler bu çerçevede açılmayı engeller.</p>';
 }else if(k==='voice'){
  b.innerHTML='<button class="mic" id="mic" onclick="toggleMic()">🎙️</button><p class="note" id="vstat" style="text-align:center">Konuşmak için mikrofona dokun</p><div class="out" id="vout">Söylediklerin burada yazılır</div><div class="row"><button class="btn" onclick="speak()">🔊 Sesli oku</button></div>';
 }else{
  b.innerHTML='<p>Bu modül için API anahtarı gerekir, sonraki aşamada eklenecek.</p>';
 }
}
function goBack(){
 if(rec){try{rec.stop()}catch(e){}}
 $('modules').style.display='grid';$('screen').style.display='none';
}
function runPy(){
 var out=[],ls=$('code').value.split('\n');
 for(var i=0;i<ls.length;i++){
  var m=ls[i].trim().match(/^print\((["'])(.*)\1\)$/);
  if(m)out.push(m[2]);
  else if(ls[i].trim()&&ls[i].trim()[0]!=='#')out.push('(satır '+(i+1)+' henüz desteklenmiyor)');
 }
 $('pout').textContent=out.join('\n')||'Çıktı yok';
}
function goWeb(){
 var u=$('url').value.trim();if(!u)return;
 if(!/^https?:\/\//.test(u))u='https://'+u;
 location.href=u;
}
function toggleMic(){
 if(window.Android){$('mic').classList.add('on');$('vstat').textContent='Dinleniyor…';Android.listen();return}
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$('vstat').textContent='Bu cihazda ses tanıma desteklenmiyor.';return}
 if(rec){rec.stop();return}
 rec=new SR();rec.lang='tr-TR';rec.interimResults=true;
 rec.onstart=function(){$('mic').classList.add('on');$('vstat').textContent='Dinleniyor…'};
 rec.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;$('vout').textContent=t};
 rec.onerror=function(){$('vstat').textContent='Mikrofon izni verilmedi veya hata oluştu.'};
 rec.onend=function(){$('mic').classList.remove('on');rec=null};
 rec.start();
}
function speak(){
 var t=$('vout').textContent;
 if(window.Android&&Android.speak){if(t)Android.speak(t);return}
 if(!window.speechSynthesis||!t)return;
 var u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';speechSynthesis.speak(u);
}
function onVoice(t,d){$('vout').textContent=t;if(d){$('mic').classList.remove('on');$('vstat').textContent='Bitti. Tekrar dokun.'}}
function onVoiceErr(m){$('mic').classList.remove('on');$('vstat').textContent=m}
</script>
</body>
</html>
